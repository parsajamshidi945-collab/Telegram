
name: Build Telegram APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Build image
        run: docker build -t telegram-build .

      - name: Compile APK
        run: docker run --rm -v "$GITHUB_WORKSPACE:/home/source" telegram-build

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: telegram-apk
          path: TMessagesProj/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
